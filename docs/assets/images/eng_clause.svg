  <text x="80" y="100" text-anchor="middle" fill="#0d47a1" font-size="13" font-family="sans-serif">Main clause</text>
  <rect x="160" y="70" width="120" height="50" rx="6" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/>
  <text x="220" y="100" text-anchor="middle" fill="#6a1b9a" font-size="13" font-family="sans-serif">Relative clause</text>
