site_name: Tong's Knowledge Base
site_description: A personal knowledge base for learning notes and ideas
site_url: https://tongtong20260127-stack.github.io/
site_author: Tong

repo_url: https://github.com/tongtong20260127-stack/tongtong20260127-stack.github.io
repo_name: tongtong20260127-stack.github.io

copyright: Copyright &copy; 2026 Tong's Knowledge Base

theme:
  name: material
  language: zh
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - header.autohide
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - zh
        - en

extra_css:
  - stylesheets/extra.css
  - stylesheets/fav-extra.css
  - stylesheets/msg-extra.css
  - stylesheets/race.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2
  - javascripts/supabase-config.js
  - javascripts/auth.js
  - javascripts/fav-api.js
  - javascripts/extra.js
  - javascripts/note-map.js
  - javascripts/quiz.js
  - javascripts/quiz-fav.js
  - javascripts/wrongbook.js
  - javascripts/question-bank.js
  - javascripts/exam.js
  - javascripts/race.js
  - javascripts/account.js
  - javascripts/favorites.js
  - javascripts/messages.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tongtong20260127-stack
      name: GitHub
  generator: false

